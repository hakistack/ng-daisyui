<hk-mesa-layout class="h-full" [labels]="layoutLabels()" [storageKey]="storageKey()">
  <hk-pdf-workspace-rail hkMesaRail />

  <hk-pdf-workspace-toolbar />
  @if (ws.view() === 'sheet') {
    @if (designer.active()) {
      <hk-pdf-form-design-toolbar />
    } @else if (store.annotationBarOpen()) {
      <hk-pdf-annotation-toolbar />
    }
    @if (store.findBarOpen()) {
      <hk-pdf-find-bar />
    }
  }

  <!-- The grid lies over the pages instead of replacing them, so they keep their scroll and rasters. -->
  <div class="relative flex min-h-0 min-w-0 flex-1">
    <div
      class="flex min-h-0 min-w-0 flex-1"
      [attr.inert]="ws.view() === 'grid' ? '' : null"
      [attr.aria-hidden]="ws.view() === 'grid' ? 'true' : null"
    >
      <hk-pdf-pages />
    </div>
    @if (ws.view() === 'grid') {
      <hk-pdf-page-organizer inline class="bg-base-100 absolute inset-0 z-30" />
    }
  </div>

  <hk-pdf-workspace-inspector hkMesaInspector />
</hk-mesa-layout>

<hk-pdf-text-editor />
<hk-pdf-annotation-dialogs />
<hk-pdf-signature-dialog />
<hk-pdf-digital-sign-dialog />
