<div
  class="@container flex items-center gap-0.5 px-2 py-1.5 border-b border-base-300 bg-base-200/60 text-sm flex-wrap"
  role="toolbar"
  aria-label="PDF toolbar"
>
  <!-- ── Group: sidebar toggle ──────────────────────────────────── -->
  @if (store.config().showSidebar !== false && store.layout() === 'default') {
    <button
      type="button"
      class="btn btn-ghost btn-xs btn-square"
      [attr.aria-label]="store.labels().toggleSidebar"
      [title]="store.labels().toggleSidebar"
      [class.btn-active]="store.state()?.sidebarOpen"
      [attr.aria-pressed]="store.state()?.sidebarOpen ? 'true' : 'false'"
      (click)="toggleSidebar()"
    >
      <svg lucidePanelLeft [size]="16"></svg>
    </button>
    <div class="w-px h-5 bg-base-300 mx-1 hidden @sm:block"></div>
  }

  <!-- ── Group: page navigation ─────────────────────────────────── -->
  <button
    type="button"
    class="btn btn-ghost btn-xs btn-square hidden @sm:inline-flex"
    [attr.aria-label]="store.labels().firstPage"
    [title]="store.labels().firstPage"
    [disabled]="!store.showPages() || (store.state()?.page ?? 0) <= 1"
    (click)="viewport.firstPage()"
  >
    <svg lucideChevronsLeft [size]="16"></svg>
  </button>
  <button
    type="button"
    class="btn btn-ghost btn-xs btn-square"
    [attr.aria-label]="store.labels().previousPage"
    [title]="store.labels().previousPage"
    [disabled]="!store.showPages() || (store.state()?.page ?? 0) <= 1"
    (click)="viewport.previousPage()"
  >
    <svg lucideChevronLeft [size]="16"></svg>
  </button>
  <div class="flex items-center gap-1 px-1">
    <input
      #pageInput
      type="number"
      class="input input-xs input-bordered w-12 text-center tabular-nums"
      [attr.aria-label]="store.labels().pageInputAriaLabel"
      [value]="store.state()?.page ?? 0"
      [min]="1"
      [max]="store.state()?.numPages ?? 1"
      [disabled]="!store.showPages()"
      (change)="onPageInput(pageInput.value)"
    />
    <span class="text-xs text-base-content/60 tabular-nums hidden @xs:inline">/ {{ store.state()?.numPages ?? 0 }}</span>
  </div>
  <button
    type="button"
    class="btn btn-ghost btn-xs btn-square"
    [attr.aria-label]="store.labels().nextPage"
    [title]="store.labels().nextPage"
    [disabled]="!store.showPages() || (store.state()?.page ?? 0) >= (store.state()?.numPages ?? 0)"
    (click)="viewport.nextPage()"
  >
    <svg lucideChevronRight [size]="16"></svg>
  </button>
  <button
    type="button"
    class="btn btn-ghost btn-xs btn-square hidden @sm:inline-flex"
    [attr.aria-label]="store.labels().lastPage"
    [title]="store.labels().lastPage"
    [disabled]="!store.showPages() || (store.state()?.page ?? 0) >= (store.state()?.numPages ?? 0)"
    (click)="viewport.lastPage()"
  >
    <svg lucideChevronsRight [size]="16"></svg>
  </button>

  <div class="w-px h-5 bg-base-300 mx-1 hidden @md:block"></div>

  <!-- ── Group: zoom ────────────────────────────────────────────── -->
  <button
    type="button"
    class="btn btn-ghost btn-xs btn-square"
    [attr.aria-label]="store.labels().zoomOut"
    [title]="store.labels().zoomOut"
    [disabled]="!store.showPages()"
    (click)="viewport.zoomOut()"
  >
    <svg lucideMinus [size]="16"></svg>
  </button>
  <select
    #zoomSelect
    class="select select-xs select-bordered w-28 hidden @md:inline-flex"
    [disabled]="!store.showPages()"
    [value]="store.state()?.zoomMode ?? 'fit-width'"
    (change)="onZoomSelect(zoomSelect.value)"
  >
    <option value="fit-width">{{ store.labels().fitWidth }}</option>
    <option value="fit-page">{{ store.labels().fitPage }}</option>
    <option value="auto">Auto</option>
    <option value="0.5">50%</option>
    <option value="0.75">75%</option>
    <option value="1">100%</option>
    <option value="1.25">125%</option>
    <option value="1.5">150%</option>
    <option value="2">200%</option>
    <option value="3">300%</option>
  </select>
  <button
    type="button"
    class="btn btn-ghost btn-xs btn-square"
    [attr.aria-label]="store.labels().zoomIn"
    [title]="store.labels().zoomIn"
    [disabled]="!store.showPages()"
    (click)="viewport.zoomIn()"
  >
    <svg lucidePlus [size]="16"></svg>
  </button>
  <span class="text-xs text-base-content/60 w-10 text-right tabular-nums hidden @md:inline">{{ store.zoomPercent() }}</span>

  <div class="w-px h-5 bg-base-300 mx-1 hidden @md:block"></div>

  <!-- ── Group: display mode ─────────────────────────────────────── -->
  <div class="join hidden @md:inline-flex">
    <button
      type="button"
      class="btn btn-xs btn-square join-item"
      [attr.aria-label]="'Continuous scroll'"
      [title]="'Continuous scroll'"
      [class.btn-active]="store.state()?.mode === 'continuous'"
      [disabled]="!store.showPages()"
      (click)="viewport.setMode('continuous')"
    >
      <svg lucideScrollText [size]="16"></svg>
    </button>
    <button
      type="button"
      class="btn btn-xs btn-square join-item"
      [attr.aria-label]="'Single page'"
      [title]="'Single page'"
      [class.btn-active]="store.state()?.mode === 'single'"
      [disabled]="!store.showPages()"
      (click)="viewport.setMode('single')"
    >
      <svg lucideSquare [size]="16"></svg>
    </button>
  </div>

  <div class="w-px h-5 bg-base-300 mx-1 hidden @md:block"></div>

  <!-- ── Group: find (inline, icon button) ──────────────────────── -->
  <button
    type="button"
    class="btn btn-ghost btn-xs btn-square"
    [attr.aria-label]="store.labels().find"
    [title]="store.labels().find + ' (⌘F)'"
    [class.btn-active]="store.findBarOpen()"
    [disabled]="!store.showPages()"
    (click)="find.openBar()"
  >
    <svg lucideSearch [size]="16"></svg>
  </button>

  <div class="grow"></div>

  <!-- ── Group: annotation tools (highlight / note / free-text + colour) ── -->
  <div class="hidden @lg:flex items-center gap-1" role="group" [attr.aria-label]="'Annotation tools'">
    <button
      type="button"
      class="btn btn-ghost btn-xs btn-square"
      [class.btn-active]="store.annotationTool() === 'highlight'"
      [attr.aria-pressed]="store.annotationTool() === 'highlight'"
      [attr.aria-label]="'Highlight'"
      title="Highlight"
      [disabled]="!store.showPages()"
      (click)="tools.toggleTool('highlight')"
    >
      <svg lucideSquare [size]="16"></svg>
    </button>
    <button
      type="button"
      class="btn btn-ghost btn-xs btn-square"
      [class.btn-active]="store.annotationTool() === 'note'"
      [attr.aria-pressed]="store.annotationTool() === 'note'"
      [attr.aria-label]="'Sticky note'"
      title="Sticky note"
      [disabled]="!store.showPages()"
      (click)="tools.toggleTool('note')"
    >
      <svg lucideMessageSquare [size]="16"></svg>
    </button>
    <button
      type="button"
      class="btn btn-ghost btn-xs btn-square"
      [class.btn-active]="store.annotationTool() === 'freetext'"
      [attr.aria-pressed]="store.annotationTool() === 'freetext'"
      [attr.aria-label]="'Text box'"
      title="Text box"
      [disabled]="!store.showPages()"
      (click)="tools.toggleTool('freetext')"
    >
      <svg lucideType [size]="16"></svg>
    </button>
    <button
      type="button"
      class="btn btn-ghost btn-xs btn-square"
      [class.btn-active]="store.annotationTool() === 'ink'"
      [attr.aria-pressed]="store.annotationTool() === 'ink'"
      [attr.aria-label]="'Draw'"
      title="Draw (freehand)"
      [disabled]="!store.showPages()"
      (click)="tools.toggleTool('ink')"
    >
      <svg lucidePen [size]="16"></svg>
    </button>
    <input
      type="color"
      class="h-6 w-6 cursor-pointer rounded border border-base-300 bg-transparent p-0"
      [value]="store.annotationColor()"
      [attr.aria-label]="'Annotation colour'"
      title="Annotation colour"
      [disabled]="!store.showPages()"
      (input)="tools.onColorInput($event)"
    />
  </div>

  <!-- ── Rotate current page ─────────────────────────────────────── -->
  <button
    type="button"
    class="btn btn-ghost btn-xs btn-square hidden @lg:inline-flex"
    [attr.aria-label]="'Rotate page'"
    title="Rotate page 90°"
    [disabled]="!store.showPages()"
    (click)="document.rotateCurrentPage()"
  >
    <svg lucideRotateCw [size]="16"></svg>
  </button>

  <!-- ── Group: file ops (icon buttons, inline at ≥ @lg) ─────────── -->
  <button
    type="button"
    class="btn btn-ghost btn-xs btn-square hidden @lg:inline-flex"
    [attr.aria-label]="store.labels().print"
    [title]="store.labels().print"
    [disabled]="!store.showPages()"
    (click)="document.print()"
  >
    <svg lucidePrinter [size]="16"></svg>
  </button>
  <button
    type="button"
    class="btn btn-ghost btn-xs btn-square hidden @lg:inline-flex"
    [attr.aria-label]="store.labels().download"
    [title]="store.labels().download"
    [disabled]="!store.showPages()"
    (click)="document.download()"
  >
    <svg lucideDownload [size]="16"></svg>
  </button>
  <button
    type="button"
    class="btn btn-ghost btn-xs btn-square hidden @lg:inline-flex"
    [attr.aria-label]="store.labels().fullscreen"
    [title]="store.labels().fullscreen"
    [disabled]="!store.showPages()"
    (click)="document.toggleFullscreen()"
  >
    <svg lucideMaximize [size]="16"></svg>
  </button>

  <!-- Overflow ⋯ — picks up everything not currently inline. -->
  <details #overflowMenu class="dropdown dropdown-end">
    <summary
      class="btn btn-ghost btn-xs btn-square @lg:hidden"
      [attr.aria-label]="store.labels().moreOptions"
      [title]="store.labels().moreOptions"
    >
      <svg lucideEllipsis [size]="16"></svg>
    </summary>
    <ul class="menu menu-sm dropdown-content bg-base-100 rounded-box z-[1] w-52 p-2 shadow border border-base-300">
      <li class="@sm:hidden">
        <button
          type="button"
          [disabled]="!store.showPages() || (store.state()?.page ?? 0) <= 1"
          (click)="viewport.firstPage(); overflowMenu.open = false"
        >
          <svg lucideChevronsLeft [size]="14"></svg>
          {{ store.labels().firstPage }}
        </button>
      </li>
      <li class="@sm:hidden">
        <button
          type="button"
          [disabled]="!store.showPages() || (store.state()?.page ?? 0) >= (store.state()?.numPages ?? 0)"
          (click)="viewport.lastPage(); overflowMenu.open = false"
        >
          <svg lucideChevronsRight [size]="14"></svg>
          {{ store.labels().lastPage }}
        </button>
      </li>
      <li class="@md:hidden">
        <button
          type="button"
          [disabled]="!store.showPages()"
          (click)="viewport.setMode(store.state()?.mode === 'continuous' ? 'single' : 'continuous'); overflowMenu.open = false"
        >
          @if (store.state()?.mode === 'continuous') {
            <svg lucideSquare [size]="14"></svg>
            Single page
          } @else {
            <svg lucideScrollText [size]="14"></svg>
            Continuous
          }
        </button>
      </li>
      <li>
        <button type="button" [disabled]="!store.showPages()" (click)="document.print(); overflowMenu.open = false">
          <svg lucidePrinter [size]="14"></svg>
          {{ store.labels().print }}
        </button>
      </li>
      <li>
        <button type="button" [disabled]="!store.showPages()" (click)="document.download(); overflowMenu.open = false">
          <svg lucideDownload [size]="14"></svg>
          {{ store.labels().download }}
        </button>
      </li>
      <li>
        <button type="button" [disabled]="!store.showPages()" (click)="document.toggleFullscreen(); overflowMenu.open = false">
          <svg lucideMaximize [size]="14"></svg>
          {{ store.labels().fullscreen }}
        </button>
      </li>
    </ul>
  </details>
</div>
